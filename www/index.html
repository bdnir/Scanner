<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#111;padding:max(48px,env(safe-area-inset-top)) 16px 130px}
h1{font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
button{font-size:18px;padding:14px;border:0;border-radius:12px;background:#1a73e8;color:#fff;width:100%}
button.sec{background:#e3e5e8;color:#111}
button.gear{width:auto;padding:6px 12px;background:#e3e5e8;color:#111;font-size:16px}
label{display:block;margin:12px 0 4px;font-size:14px;color:#444}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}
textarea{height:90px;direction:ltr;font-size:13px}
#log{margin-top:16px;white-space:pre-wrap;font-size:15px;line-height:1.5}
.fab{position:fixed;left:16px;right:16px;bottom:max(56px,env(safe-area-inset-bottom));width:auto;border-radius:32px;padding:18px;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
button.small{width:auto;font-size:15px;padding:8px 18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.panel{display:none;background:#fff;border-radius:12px;padding:16px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:16px}
small{color:#666}
</style>
</head>
<body>
<h1><span id="title">Scanner</span><button class="gear" id="gearBtn">⚙</button></h1>
<div id="log"></div>
<button id="scanBtn" class="fab"></button>

<div class="panel" id="review">
  <b id="reviewTitle"></b>
  <label id="lType"></label><input id="rType" list="folders">
  <datalist id="folders"></datalist>
  <label id="lPeriod"></label><input id="rPeriod" dir="ltr" placeholder="2026.11-12">
  <div class="row"><button id="rOk"></button><button class="sec" id="rCancel"></button></div>
</div>

<div class="panel" id="settings">
  <div class="top"><b id="sTitle"></b><button id="sOk" class="small"></button></div>
  <label id="lFolder"></label>
  <button class="sec" id="pickBtn" type="button"></button>
  <small id="folderName"></small>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sAuto" style="width:auto"><span id="lAuto"></span></label>
  <label id="lFmt"></label>
  <select id="sFmt"><option value="pdf">PDF</option><option value="jpg">JPG</option></select>
  <label id="lLang"></label>
  <select id="sLang"><option value="he">עברית</option><option value="en">English</option></select>
  <label>Gemini API key</label><input id="sG" dir="ltr" autocapitalize="off" autocorrect="off">
  <label>OpenRouter API key</label><input id="sO" dir="ltr" autocapitalize="off" autocorrect="off">
  <label id="lModels"></label><textarea id="sM" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  <small id="hModels"></small>
</div>
<script src="app.js"></script>
</body>
</html>
